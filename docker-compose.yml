# =====================================================================
# NovaERP - production docker-compose
# =====================================================================
# This file orchestrates the two services for an IP-only VPS deploy:
#
#   nginx (web)    : public, listens on $WEB_PORT (default 80). Serves
#                    the React SPA and reverse-proxies /v1/* and
#                    /health to the backend.
#   backend (api)  : internal-only. Listens on 4000 inside the docker
#                    network; the SPA reaches it through the nginx
#                    container, so we don't need to publish 4000 to
#                    the host or open a firewall hole for it.
#
# Persistent state:
#   - SQLite DB stored in the named volume `novaerp_db` mounted at
#     /data inside the backend. DATABASE_URL=file:/data/dev.db.
#     Survives `docker compose down`. Drop the volume with
#     `docker volume rm pvsresponse_novaerp_db` to wipe all data.
#
# Quick start on a fresh VPS:
#     cp .env.deploy.example .env
#     # edit .env: set JWT_SECRET to something long & random
#     docker compose pull
#     docker compose up -d --build
#     # wait ~30s, then hit http://<VPS_IP>/
#
# Postgres upgrade path: see DEPLOYMENT.md "Switching to Postgres".
# =====================================================================

# Compose v2 + does not require a "version:" key.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: novaerp-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Always bind 0.0.0.0 inside the container so docker can route
      # traffic from the nginx upstream.
      HOST: 0.0.0.0
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:-file:/data/dev.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      # The SPA shares an origin with the API (nginx in front), so we
      # don't strictly need CORS. But /v1/public/* may be hit by
      # external dashboards or the share viewers from other origins,
      # so keep "*" unless you know the consumer's origin upfront.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - novaerp_db:/data
    # No `ports:` here - keep the API off the public network.
    expose:
      - "4000"
    networks:
      - novaerp
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://localhost:4000/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./erp-portal
      dockerfile: Dockerfile
      args:
        # Empty = same-origin. The browser hits /v1/* on the nginx
        # in this same container; nginx upstream forwards to backend.
        VITE_API_URL: ${VITE_API_URL:-}
    image: novaerp-web:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Expose port 80 (or whatever WEB_PORT is set to) on the host.
      - "${WEB_PORT:-80}:80"
    networks:
      - novaerp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

# Named volume so the SQLite database survives container rebuilds.
volumes:
  novaerp_db:
    driver: local

networks:
  novaerp:
    driver: bridge
