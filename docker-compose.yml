# =====================================================================
# NovaERP - production docker-compose
# =====================================================================
# This file orchestrates the services for an IP-only VPS deploy:
#
#   postgres (db)  : PostgreSQL 16 database, internal only on :5432.
#   redis    (cache): Redis 7 cache for storefront catalog + in-stock, :6379.
#   nginx (web)    : ERP admin portal on $WEB_PORT (default 80).
#   nginx (shop)   : Prakruthivanam storefront on $SHOP_PORT (default 8080).
#   backend (api)  : internal-only on :4000; both frontends proxy /v1/*.
#
# Persistent state:
#   - PostgreSQL data in the named volume `novaerp_pg`.
#     Survives `docker compose down`. Drop with:
#     `docker volume rm pvsresponse_novaerp_pg` to wipe all data.
#   - Redis data (RDB snapshot every 60s) in `redis_data`.
#   - Product uploads in `novaerp_uploads`.
#
# Quick start (dev — local build):
#     cp .env.deploy.example .env
#     # edit .env: set JWT_SECRET and POSTGRES_PASSWORD to random values
#     docker compose up -d --build
#     # http://localhost/
#
# Quick start (VPS — pull prebuilt images from GHCR):
#     cp .env.deploy.example .env                  # set JWT_SECRET, etc.
#     export REGISTRY_OWNER=<github user/org, lowercase>
#     export IMAGE_TAG=latest                       # or sha-<short> / v1.2.3
#     docker compose pull
#     docker compose up -d --no-build
#     # http://<VPS_IP>/
#
# When REGISTRY_OWNER is unset (dev), the image: lines below stay as
# bare local tags (novaerp-backend:latest …). When it's set (VPS),
# bash-style substitution prepends ghcr.io/<owner>/ automatically, so
# `docker compose pull` works without needing -f docker-compose.prod.yml.
# The overlay file is still useful for forcing pull_policy=always; see
# docker-compose.prod.yml for that and rollback examples.
# =====================================================================

# Compose v2 + does not require a "version:" key.

services:
  # ── Database ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novaerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env}
      POSTGRES_DB: novaerp
    volumes:
      - novaerp_pg:/var/lib/postgresql/data
    networks:
      - novaerp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaerp -d novaerp -q"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # ── Cache ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist to disk every 60s if at least 1 key changed (RDB snapshot).
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - novaerp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Application ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${REGISTRY_OWNER:+ghcr.io/${REGISTRY_OWNER}/}novaerp-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Always bind 0.0.0.0 inside the container so docker can route
      # traffic from the nginx upstream.
      HOST: 0.0.0.0
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://novaerp:${POSTGRES_PASSWORD:-changeme}@postgres:5432/novaerp?schema=public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      # Redis cache for storefront catalog and in-stock flags.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # The SPA shares an origin with the API (nginx in front), so we
      # don't strictly need CORS. But /v1/public/* may be hit by
      # external dashboards or the share viewers from other origins,
      # so keep "*" unless you know the consumer's origin upfront.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - novaerp_uploads:/app/uploads
    # No `ports:` here - keep the API off the public network.
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novaerp
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./erp-portal
      dockerfile: Dockerfile
      args:
        # Empty = same-origin. The browser hits /v1/* on the nginx
        # in this same container; nginx upstream forwards to backend.
        VITE_API_URL: ${VITE_API_URL:-}
    image: ${REGISTRY_OWNER:+ghcr.io/${REGISTRY_OWNER}/}novaerp-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Expose port 80 (or whatever WEB_PORT is set to) on the host.
      - "${WEB_PORT:-80}:80"
    networks:
      - novaerp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

  shop:
    build:
      context: ./pvsecommerce
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_MOCK_STOREFRONT_TOKEN: ${VITE_MOCK_STOREFRONT_TOKEN:-}
    image: ${REGISTRY_OWNER:+ghcr.io/${REGISTRY_OWNER}/}novaerp-shop:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SHOP_PORT:-8080}:80"
    networks:
      - novaerp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

# Named volumes so state survives container rebuilds.
#   novaerp_pg      - PostgreSQL database
#   redis_data      - Redis RDB snapshots (cache is ephemeral but TTLs survive restarts)
#   novaerp_uploads - Product photo uploads (/app/uploads inside backend)
#
# SQLite rollback: novaerp_db volume is intentionally not declared here.
# If you need to roll back to SQLite, add it back and update DATABASE_URL.
volumes:
  novaerp_pg:
    driver: local
  redis_data:
    driver: local
  novaerp_uploads:
    driver: local

networks:
  novaerp:
    driver: bridge
