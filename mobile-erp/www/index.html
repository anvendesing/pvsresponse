    <script>
      // When the Capacitor WebView opens index.html, the URL is "/" (or
      // index.html) - which would route us to the desktop dashboard
      // login. We're a warehouse APK, so force the URL to /m/login
      // BEFORE React Router boots. history.replaceState doesn't trigger
      // a navigation, just updates the address so BrowserRouter reads
      // the right initial location.
      (function () {
        var p = window.location.pathname || "/";
        if (p === "/" || /\/index\.html$/.test(p)) {
          history.replaceState({}, "", "/m/login");
        }
      })();
    </script>
