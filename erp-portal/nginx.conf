# NovaERP frontend - nginx site config.
#
# Behaviour:
#   - Static SPA files served from /usr/share/nginx/html.
#   - Any URL that doesn't match a real file is rewritten to index.html
#     so React Router (BrowserRouter) handles the routing.
#   - /v1/* and /health are reverse-proxied to the backend service
#     (the upstream name "backend" comes from docker-compose). This
#     means the SPA can talk to the backend WITHOUT VITE_API_URL set
#     and without CORS, because the browser only ever sees one origin.
#   - WebSocket / streaming-friendly headers in case future endpoints
#     upgrade (e.g. live order feeds).
#
# Deployment notes:
#   - For TLS termination, put a reverse proxy (Caddy / Traefik / a
#     second nginx) in front of this container. The site itself stays
#     plain HTTP because we only listen on :80; the TLS layer can
#     forward to us via http upstream cleanly.
#   - When you eventually attach a domain, no change is needed here -
#     this server_name "_" matches any host header.

upstream novaerp_backend {
    # `backend` is the docker-compose service name. The backend
    # container exposes 4000 internally; we don't publish it externally.
    server backend:4000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Sensible upload limit for invoices/photo uploads etc.
    client_max_body_size 25m;

    # Gzip text payloads. SPA bundles compress very well.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm application/xml application/xml+rss
               image/svg+xml font/ttf font/otf;
    gzip_min_length 1024;
    gzip_vary on;

    # ----------------- Backend reverse proxy -----------------
    # Order matters: location blocks are matched as prefixes, so /v1
    # and /health must come BEFORE the catch-all SPA fallback.

    location /v1/ {
        proxy_pass http://novaerp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Tighter timeouts than the nginx default so a hung backend
        # doesn't keep browser tabs hanging.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        # Buffer turn-off helps when we add SSE/streaming endpoints.
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://novaerp_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Keep this lightweight - VPS load balancers and our
        # Docker HEALTHCHECK both poll this endpoint.
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
        access_log off;
    }

    # ----------------- Static SPA fallback -----------------
    # Cache hashed bundle assets aggressively. index.html stays
    # uncached so a redeploy is picked up immediately.

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Force revalidation of the entry document so post-deploy
        # users always get the latest bundle hashes.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
